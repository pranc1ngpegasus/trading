[workspace]
members = ["crates/order-lifecycle", "crates/removeme", "crates/tws-api"]
resolver = "3"

[workspace.dependencies]
buffa = "0.9.2"
buffa-build = "0.9.2"
proptest = "1.12.0"
stateright = "0.31.0"

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "deny"

[workspace.metadata.crane]
name = "trading"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2026.11.1"

# Mutation runs rebuild and retest the tree once per mutant. Nothing reads the
# debug info in those artifacts, and it costs `rustc` memory and time on every
# rebuild. `crates/order-lifecycle` (224 mutants) peaked at 4.60 GB and 830-848 s
# on this profile against 4.92 GB and 945 s on `test`. `.cargo/mutants.toml`
# points cargo-mutants at this profile.
[profile.mutants]
debug = false
inherits = "test"
